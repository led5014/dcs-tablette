<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Ajoutée à l'écran d'accueil (iPad, iPhone, Android), la page s'ouvre
     sans la barre du navigateur : toute la hauteur sert aux écrans. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DCS Tablette">
<meta name="theme-color" content="#0b0d0e">
<title>DCS Tablette</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="barre">
  <span id="etat" class="etat inconnu" role="status" aria-label="DCS : …"></span>
  <!-- L'appareil : celui que DCS annonce (Auto), ou choisi à la main pour
       préparer la page avant même de lancer la mission. -->
  <select id="appareil" aria-label="Appareil"><option value="auto">Auto · DCS : …</option></select>
  <!-- Rempli d'après le profil de l'appareil et la place disponible : une
       disposition n'est proposée que si chacun de ses panneaux reste
       confortable au doigt sur cet écran-là. -->
  <span class="saut" aria-hidden="true"></span>
  <nav id="modes" aria-label="Disposition"></nav>
  <nav id="sieges" aria-label="Siège" hidden></nav>
  <button id="bascule" class="bascule">Kneeboard</button>
  <button id="plein" class="plein" hidden aria-label="Plein écran">⛶</button>
</header>

<main id="scene" aria-label="Écrans du cockpit"></main>

<section id="kneeboard" hidden aria-label="Kneeboard">
  <div class="kb-barre">
    <select id="kb-carnet" aria-label="Carnet"></select>
    <button id="kb-prec" aria-label="Page précédente">‹</button>
    <span id="kb-num"></span>
    <button id="kb-suiv" aria-label="Page suivante">›</button>
    <!-- Où va le kneeboard quand on l'ouvre dans DCS (RShift+K, K) : sur le
         PC comme d'habitude, ou ici, la tablette basculant d'elle-même. -->
    <nav id="kb-sur" aria-label="Kneeboard ouvert dans DCS : afficher sur">
      <span class="kb-sur-titre">Kneeboard DCS sur</span>
      <button data-sur="pc">PC</button>
      <button data-sur="tablette">Tablette</button>
    </nav>
  </div>
  <div id="kb-vue">
    <canvas id="kb-direct" aria-label="Kneeboard de DCS en direct"></canvas>
    <p id="kb-msg">En attente du kneeboard de DCS…</p>
    <img id="kb-image" alt="Page de kneeboard" draggable="false">
    <p id="kb-vide" hidden>Aucune page à afficher.<br>
      Dépose des images PNG ou JPG dans <code>Saved Games\DCS\Kneeboard</code>
      (ou son sous-dossier au nom de l'appareil), ou vole une mission qui en
      embarque.</p>
  </div>
</section>

<script src="/app.js"></script>
</body>
</html>
