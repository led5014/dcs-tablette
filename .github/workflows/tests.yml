name: Tests

# Les tests tournent sur Windows, comme le programme : raccourcis, cmd et
# robocopy n'existent pas ailleurs. Ceux qui ont besoin de DCS (son lua.dll,
# les scripts d'un module) s'ignorent d'eux-mêmes ici.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v
